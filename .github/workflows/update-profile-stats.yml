

name: Update GitHub profile statistics

on:
  schedule:
    - cron: "17 0 * * *" # Daily at 00:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-github-profile-statistics
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      - name: Generate GitHub profile statistics
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=honeywic&show_icons=true&theme=tokyonight&hide_border=true&rank_icon=github
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top programming languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=honeywic&layout=compact&langs_count=8&theme=tokyonight&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate MVS repository statistics
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=honeywic&repo=MVS&theme=tokyonight&hide_border=true
          path: profile/mvs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg profile/mvs.svg
          if git diff --cached --quiet; then
            echo "Statistics cards are already up to date."
            exit 0
          fi
          git commit -m "chore: update GitHub profile statistics"
          git push





